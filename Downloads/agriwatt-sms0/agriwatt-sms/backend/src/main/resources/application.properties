server.port=8082
spring.datasource.url=jdbc:mysql://${AGRIWATT_DB_HOST:127.0.0.1}:${AGRIWATT_DB_PORT:3307}/agriwatt?useSSL=false&serverTimezone=Africa/Tunis
spring.datasource.username=${AGRIWATT_DB_USERNAME:agriwatt}
spring.datasource.password=${AGRIWATT_DB_PASSWORD:agriwatt123}
spring.jpa.hibernate.ddl-auto=update
python.service.url=http://localhost:8000

# --- Alertes SMS (TextBee) : la clé vient UNIQUEMENT de la variable d'environnement TEXTBEE_API_KEY ---
textbee.base-url=${TEXTBEE_BASE_URL:https://api.textbee.dev/api/v1}
textbee.api-key=${TEXTBEE_API_KEY:}
textbee.device-id=${TEXTBEE_DEVICE_ID:}
agriwatt.alerts.lead-hours=2
agriwatt.alerts.risk-threshold=0.8
agriwatt.alerts.max-attempts=5
agriwatt.alerts.retry-minutes=10
