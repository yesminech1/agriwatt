# Configuration des TESTS uniquement (mvn test) : base H2 en mémoire, aucun MySQL nécessaire.
spring.datasource.url=jdbc:h2:mem:agriwatt-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Port volontairement fermé : on vérifie le plan B (fichiers de secours) quand Python est éteint.
python.service.url=http://localhost:59999
# Tests : tâches planifiées désactivées (les tests appellent les services directement), TextBee non configuré par défaut
agriwatt.alerts.scheduler-enabled=false
textbee.api-key=
agriwatt.detection.storage-dir=target/test-uploads/plant-analyses
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
